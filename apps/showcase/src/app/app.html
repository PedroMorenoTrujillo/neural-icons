<div class="shell">
  <app-showcase-header
    [copy]="t()"
    [view]="view()"
    [locale]="locale()"
    [theme]="theme()"
    [isModalOpen]="!!selected() && isNarrow()"
    [catalogHref]="viewHref('catalog')"
    [guideHref]="viewHref('guide')"
    (navigate)="setView($event.event, $event.view)"
    (localeChange)="setLocale($event)"
    (themeChange)="setTheme($event)"
  />

  <main class="workspace" [class.with-detail]="selected()">
    <div
      class="catalog-column"
      [class.guide-view]="view() === 'guide'"
      [attr.inert]="selected() && isNarrow() ? '' : null"
    >
      @if (view() === 'catalog') {
      <app-catalog-view
        [copy]="t()"
        [locale]="locale()"
        [framework]="framework()"
        [icons]="icons()"
        [categories]="categories"
        [category]="category()"
        [query]="query()"
        [selectedName]="selectedName()"
        [total]="total"
        [heroIcons]="heroIcons"
        [searchIcon]="searchIcon"
        [guideHref]="viewHref('guide')"
        (navigateGuide)="setView($event, 'guide')"
        (queryChange)="query.set($event)"
        (clearSearch)="clearQuery()"
        (categoryChange)="setCategory($event)"
        (familySelected)="selectFamily($event.event, $event.name)"
      />
      } @else {
      <app-guide-view
        [copy]="t()"
        [framework]="framework()"
        [installSnippet]="installSnippet()"
        [setupSnippet]="setupSnippet()"
        [colorSnippet]="colorSnippet()"
        [accessibilitySnippet]="accessibilitySnippet()"
        (frameworkChange)="setFramework($event)"
      />
      }
    </div>

    @if (selected(); as family) {
    <app-detail-panel
      [copy]="t()"
      [family]="family"
      [definition]="definition()"
      [selectedVariant]="selectedVariant()"
      [framework]="framework()"
      [isNarrow]="isNarrow()"
      [previewColor]="previewColor()"
      [sizes]="sizes"
      [colors]="colors"
      [importStatement]="importStatement()"
      [svgAssetPath]="svgAssetPath()"
      [snippet]="snippet()"
      [copyFeedback]="copyFeedback()"
      (closeRequested)="closeDetail()"
      (variantChange)="setSelectedVariant($event)"
      (frameworkChange)="setFramework($event)"
      (colorChange)="setPreviewColor($event)"
      (copyRequested)="copy($event.value, $event.item)"
    />
    }
  </main>
</div>
