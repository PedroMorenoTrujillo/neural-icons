name: Verify and publish Icons

on:
  pull_request:
  push:
    branches: [main]
    tags: ['core@*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify and build without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: icons-release-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Verify the publisher and Core tag before any release work
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/release-batch.mjs --identity
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run verify:release
      - name: Pack all four exact release artifacts
        run: npm run release:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: icons-packages
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    if: github.repository == 'PedroMorenoTrujillo/neural-icons' && github.actor == 'PedroMorenoTrujillo' && github.triggering_actor == 'PedroMorenoTrujillo' && startsWith(github.ref, 'refs/tags/core@') && inputs.verify_only != true
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: icons-packages
          path: dist/release/
      - name: Publish Core, then Angular, React and Vue; verify exact public npm archives
        run: node tools/release-batch.mjs --publish
      - name: Install and exercise the published Angular package in a clean consumer
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
          node tools/verify-clean-angular-consumer.mjs --registry-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: icons-registry-verification
          path: dist/release/registry-verified.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
